version: '3.8'

services:
  face-recognition:
    build:
      context: ./face_recognition
      dockerfile: Dockerfile
    container_name: face-recognition
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
